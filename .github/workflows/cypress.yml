name: Cypress QA Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 05-cypress-automation/package-lock.json

      - name: Install dependencies
        working-directory: 05-cypress-automation
        run: npm ci

      - name: Run Cypress tests
        working-directory: 05-cypress-automation
        run: npx cypress run

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          path: |
            05-cypress-automation/cypress/screenshots/
            05-cypress-automation/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7