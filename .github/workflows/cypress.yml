name: Cypress QA Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 05-cypress-automation/package-lock.json

      - name: Install dependencies
        working-directory: 05-cypress-automation
        run: npm ci

      - name: Run Cypress tests
        working-directory: 05-cypress-automation
        run: npx cypress run